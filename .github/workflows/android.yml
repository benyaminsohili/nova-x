
name: NOVA X APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source archive
        run: unzip -q NOVA-X-Starter.zip -d source

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p source/NOVA-X-Starter :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-apk
          path: source/NOVA-X-Starter/app/build/outputs/apk/debug/app-debug.apk
