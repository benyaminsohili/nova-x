
name: NOVA X Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nova-x-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA X
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e
          sdkmanager --licenses </dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.2.11394342"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/NOVA-X/android/gradlew" ]; then
            APP_DIR="$GITHUB_WORKSPACE/NOVA-X/android"
          elif [ -f "$GITHUB_WORKSPACE/android/gradlew" ]; then
            APP_DIR="$GITHUB_WORKSPACE/android"
          else
            echo "ERROR: Android gradlew not found"
            find . -name gradlew
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          chmod +x "$APP_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK_DIR="$APP_DIR/app/build/outputs/apk/debug"
          find "$APK_DIR" -name "*.apk"
          test -n "$(find "$APK_DIR" -name '*.apk' -print -quit)"

      - name: Upload NOVA X APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-Android-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
