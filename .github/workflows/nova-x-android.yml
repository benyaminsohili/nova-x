
name: NOVA X Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nova-x-android
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA X
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.2.11394342

      - name: Configure Android NDK
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/ndk/26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            NOVA-X -> NOVA-X/target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Verify project files
        shell: bash
        run: |
          set -e
          test -f NOVA-X/Cargo.toml
          test -f NOVA-X/android/gradlew
          test -f NOVA-X/android/app/build.gradle.kts
          chmod +x NOVA-X/android/gradlew

      - name: Build NOVA X Debug APK
        shell: bash
        run: |
          set -e
          cd NOVA-X/android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK_DIR="NOVA-X/android/app/build/outputs/apk/debug"
          echo "Generated APK files:"
          find "$APK_DIR" -type f -name "*.apk"
          test -n "$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

      - name: Upload NOVA X APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-Android-APK
          path: NOVA-X/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
