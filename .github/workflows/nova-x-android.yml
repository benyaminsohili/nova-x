
name: NOVA X Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nova-x-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA X APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;26.2.11394342"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Extract source and find Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for existing Android project..."

          GRADLEW="$(find "$GITHUB_WORKSPACE" \
            -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found. Searching for source ZIP files..."

            mkdir -p "$RUNNER_TEMP/nova-source"

            while IFS= read -r ZIPFILE; do
              echo "Checking archive: $ZIPFILE"
              unzip -tq "$ZIPFILE"
              DEST="$RUNNER_TEMP/nova-source/$(basename "$ZIPFILE" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIPFILE" -d "$DEST"
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip')

            GRADLEW="$(find "$RUNNER_TEMP/nova-source" \
              -type f -name gradlew \
              -print -quit || true)"
          fi

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew found in repository or ZIP archives."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -250
            echo "Extracted files:"
            find "$RUNNER_TEMP/nova-source" -maxdepth 5 -type f | head -250
            exit 1
          fi

          ANDROID_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "ERROR: app Gradle file not found."
            find "$(dirname "$ANDROID_DIR")" \
              \( -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$ANDROID_DIR"

      - name: Build NOVA X APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$ANDROID_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found"
            exit 1
          fi

          find "$APK_DIR" -type f -name '*.apk' -print

          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully: $APK"

      - name: Upload NOVA X APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-Android-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
