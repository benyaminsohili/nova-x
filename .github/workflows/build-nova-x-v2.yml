
name: Build NOVA X v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nova-x-v2
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA X Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract NOVA X source
        shell: bash
        run: |
          set -e
          ZIP=""

          for f in \
            NOVA-X-Android-Source-V2.zip \
            NOVA-X-Android-Source-Lite.zip \
            NOVA-X-Starter.zip
          do
            if [ -f "$f" ]; then
              ZIP="$f"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            ls -la
            exit 1
          fi

          unzip -tq "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

          GRADLEW=$(find source -type f -name gradlew -print -quit)
          test -n "$GRADLEW"

          APP_DIR="$(dirname "$GRADLEW")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.2.11394342"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source/NOVA-X -> source/NOVA-X/target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK_DIR="$APP_DIR/app/build/outputs/apk/debug"
          find "$APK_DIR" -name "*.apk"
          test -n "$(find "$APK_DIR" -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-v2-Android-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
