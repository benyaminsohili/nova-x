
name: Build NOVA X v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOVA-X-Android-Source-V2.zip"
      - ".github/workflows/build-nova-x-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.2.11394342
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.2.11394342

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NOVA X source
        run: |
          unzip -q NOVA-X-Android-Source-V2.zip -d source
          test -f source/NOVA-X/android/gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nova-x-v2
          cache-bin: "false"
          workspaces: |
            source/NOVA-X -> target

      - name: Install Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.2.11394342"
          cargo install cargo-ndk --locked

      - name: Build NOVA X APK
        working-directory: source/NOVA-X/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-v2-Android-APK
          path: source/NOVA-X/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
